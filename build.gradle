plugins {
  id 'java'
  id 'jacoco'
  id 'io.github.ben-manes.versions' version '0.60.0'
  // SBOM for the CodeQL workflow's supply-chain artefact, as in service-cp-crime-results-pcr.
  id 'org.cyclonedx.bom' version '3.3.0'
  // Microsoft's official Azure Functions Gradle plugin — the equivalent of
  // azure-functions-maven-plugin. Provides azureFunctionsPackage / azureFunctionsRun /
  // azureFunctionsDeploy, and generates function.json from the @FunctionName annotations.
  id 'com.microsoft.azure.azurefunctions' version '1.17.0'
  // Starts the docker-compose services the integration tests need before `test` in CI — the same
  // pattern and plugin service-cp-crime-results-pcr uses for its Postgres/Redis.
  id 'com.avast.gradle.docker-compose' version '0.17.21'
}

group = 'uk.gov.hmcts.cp'
version = System.getProperty('ARTEFACT_VERSION') ?: '0.0.999'

// Deployment coordinates. Confirm with the platform team before first deploy — the resource group
// in particular is inherited from the legacy LAA app and is likely wrong for an AMP-owned service.
// Deployment coordinates follow the estate convention: fa-<env>-ccpNNNN-<short> inside
// RG-<ENV>-CCPNNNN-HEARINGRES, alongside the seven sibling hearing-resulted function apps.
//
// An `ext` property, not a `def` local: gradle/docker-test.gradle needs functionAppName to locate the
// staging directory it mounts into the container, and applied scripts cannot see locals.
ext.functionAppName = System.getProperty('FUNCTION_APP_NAME') ?: 'fa-ste-ccp0121-pcrrelay'

apply {
  from("$rootDir/gradle/repositories.gradle")
  from("$rootDir/gradle/java.gradle")
  from("$rootDir/gradle/test.gradle")
  from("$rootDir/gradle/pmd.gradle")
  from("$rootDir/gradle/docker-test.gradle")
}

// We MUST keep all dependencies in the build.gradle to allow dependabot to provide version updates
// Sadly, dependabot does not track dependencies in the apply-from files
dependencies {
  // Azure Functions. Must be `implementation`, NOT `compileOnly`: azureFunctionsPackage scans the
  // runtime classpath to find @FunctionName entry points, and fails with
  // ClassNotFoundException: com.microsoft.azure.functions.annotation.FunctionName if the
  // annotations are only on the compile classpath.
  //
  // Consequence: unlike the Maven build's `provided` scope, this artifact IS staged into lib/.
  // The Java worker supplies its own copy at runtime, and two copies risk binding-resolution
  // errors, so the pruneWorkerProvidedJars task below removes it after packaging.
  implementation 'com.microsoft.azure.functions:azure-functions-java-library:3.3.0'

  // JSON
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'

  // Logging
  implementation 'org.slf4j:slf4j-api:2.0.18'
  implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'

  // Test — JUnit + AssertJ only, no mocking framework by design.
  // The BOM keeps junit-jupiter and the platform launcher on matching versions.
  testImplementation platform('org.junit:junit-bom:6.1.3')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'org.assertj:assertj-core:3.27.7'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  // Integration tests (src/test/.../integration) drive the docker-compose stack over HTTP.
  // Same WireMock version as service-cp-crime-results-pcr; used as a client against the
  // compose-started WireMock rather than in-process, since the container under test must reach it.
  testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
  // The host acknowledges the webhook before the invocation completes, so assertions on what the
  // stub received have to poll rather than read immediately.
  testImplementation 'org.awaitility:awaitility:4.3.0'
}

azurefunctions {
  appName = functionAppName
  resourceGroup = System.getProperty('FUNCTION_RESOURCE_GROUP') ?: 'RG-STE-CCP0121-HEARINGRES'
  region = 'uksouth'
  // Reuse the resource group's existing shared plan (EP3, ElasticPremium, Linux) rather than letting
  // the plugin create one: all seven sibling hearing-resulted apps share it. Verified Linux
  // (reserved=true), so a Java 25 linux app is compatible with it.
  appServicePlanName = System.getProperty('FUNCTION_APP_SERVICE_PLAN') ?: 'as-ste-ccp0121-hearingres'

  runtime {
    os = 'linux'
    // '25' (or 'Java 25') — NOT '25.0'. Verified against azureFunctionsDeploy: '25' and 'Java 25'
    // both deploy; '25.0' fails with "Invalid runtime configuration".
    //
    // Do not "align" this with the Azure CLI, which wants the opposite: `az functionapp create
    // --runtime-version` accepts only '25.0' and rejects '25'. The two tools validate the same
    // concept with incompatible formats, so the README's az command and this block differ on
    // purpose.
    javaVersion = '25'
  }

  auth {
    type = 'azure_cli'
  }

  appSettings {
    WEBSITE_RUN_FROM_PACKAGE = '1'
    FUNCTIONS_EXTENSION_VERSION = '~4'
    FUNCTIONS_WORKER_RUNTIME = 'java'
    // The CA bundle ships in the package (see stageInternalCaBundle), so this path is where it
    // lands. Only applied by azureFunctionsDeploy — a config-zip deploy needs it set separately
    // with `az functionapp config appsettings set`.
    PCR_SERVICE_CA_BUNDLE_PATH = '/home/site/wwwroot/internal_ca_certs.pem'
  }

  localDebug = "transport=dt_socket,server=y,suspend=n,address=5005"
}

// azureFunctionsPackage stages every runtime dependency into lib/, including
// azure-functions-java-library. The Azure Functions Java worker provides that library itself, and
// a second copy on the classpath risks binding-resolution errors — the Maven build avoided this
// with `provided` scope, which is not available to us here (see the dependency comment above).
// Verified behaviour: the plugin does NOT exclude it, so prune it explicitly.
def workerProvidedJarPatterns = ['azure-functions-java-library-*.jar']

tasks.register('pruneWorkerProvidedJars') {
  description = 'Removes worker-provided jars from the staged Azure Functions lib/ directory.'
  def stagedLib = layout.buildDirectory.dir("azure-functions/${functionAppName}/lib")
  outputs.upToDateWhen { false }
  doLast {
    def libDir = stagedLib.get().asFile
    if (!libDir.exists()) {
      return
    }
    fileTree(libDir).matching { include workerProvidedJarPatterns }.each { jar ->
      logger.lifecycle("Pruning worker-provided ${jar.name} from staged lib/")
      if (!jar.delete()) {
        throw new GradleException("Could not delete ${jar} from the staging directory")
      }
    }
  }
}

// The PCR service's internal ingress presents a private-CA certificate no JVM ships, so the CA
// bundle has to travel with the app. Staged into the deployment package so it lands at
// /home/site/wwwroot/internal_ca_certs.pem — the same place and filename the Node sibling apps use
// (they point NODE_EXTRA_CA_CERTS at it; we point PCR_SERVICE_CA_BUNDLE_PATH at it).
//
// WEBSITE_LOAD_CERTIFICATES is NOT an alternative here: on Linux it exposes certificates as
// individual DER files under /var/ssl/certs, which AdditiveTrust (a single PEM path) cannot consume.
//
// There are two sources, and which one is used is deliberate:
//
//   CA_BUNDLE_SOURCE set  ->  that path, and it MUST exist. CI fetches the bundle from
//                             infrastructure, writes it outside the repo tree, and points this at
//                             it. Missing or not a PEM fails the build.
//   CA_BUNDLE_SOURCE unset -> .local/internal_ca_certs.pem, which is git-ignored and never
//                             committed. Present only on a developer machine.
//
// No certificate material is tracked in this repository. Failing hard when CA_BUNDLE_SOURCE is set
// but unusable is the point of the split: a CI run that silently fell back would package a
// certificate nobody had reviewed, and one that packaged nothing would deploy an app that fails
// every relay at the TLS handshake with no build-time signal. Local builds keep a convenient
// fallback; CI gets none.
//
// Accepts a system property or an environment variable, so both `-DCA_BUNDLE_SOURCE=...` and an
// exported env var work — GitHub Actions sets the latter via GITHUB_ENV.
def caBundleSourceSetting = (System.getProperty('CA_BUNDLE_SOURCE')
        ?: System.getenv('CA_BUNDLE_SOURCE'))?.trim()

def caBundleFromInfra = null
if (caBundleSourceSetting) {
  final File candidate = new File(caBundleSourceSetting)
  caBundleFromInfra = candidate.isAbsolute() ? candidate
          : layout.projectDirectory.file(caBundleSourceSetting).asFile
}

// Git-ignored (see .gitignore) — a developer places the bundle here by hand. Deliberately not the
// repo root, where it used to be committed.
def localCaBundlePath = '.local/internal_ca_certs.pem'
def caBundleFromLocalDir = layout.projectDirectory.file(localCaBundlePath).asFile

// The staged filename is fixed regardless of what the source file is called, because the
// PCR_SERVICE_CA_BUNDLE_PATH app setting names this exact path inside wwwroot.
def stagedCaBundleName = 'internal_ca_certs.pem'

// Used by verifyStagedApp: if a bundle was available, the package must actually contain it.
def caBundleExpected = caBundleFromInfra != null || caBundleFromLocalDir.isFile()

// Deliberately NOT a Copy task, and this is load-bearing. A Copy's `into` directory becomes a
// declared task output, and azureFunctionsPackage already declares that same directory as *its*
// output. Overlapping outputs make Gradle's up-to-date checking and stale-output cleanup unreliable
// for both tasks, and the observed result on CI was a staged app containing only this PEM: the
// Functions host then started cleanly, logged "0 functions found", served nothing, and the
// integration tests spent five minutes waiting for a function that had never been staged.
// Copying by hand keeps the staging directory owned by exactly one task. Do not "tidy" this back
// into a Copy.
def stagedAppDir = layout.buildDirectory.dir("azure-functions/${functionAppName}")

tasks.register('stageInternalCaBundle') {
  description = 'Stages the internal CA bundle (from CA_BUNDLE_SOURCE, or the repo copy) into the package.'
  // The staging directory belongs to azureFunctionsPackage, so this task declares no outputs of its
  // own and simply always runs. It also must re-run whenever CA_BUNDLE_SOURCE changes, and an
  // environment variable is not a task input Gradle would notice.
  outputs.upToDateWhen { false }
  doLast {
    File source = null
    if (caBundleFromInfra != null) {
      if (!caBundleFromInfra.isFile()) {
        throw new GradleException("CA_BUNDLE_SOURCE is set to '${caBundleSourceSetting}' but "
                + "${caBundleFromInfra} is not a readable file.\n"
                + "CI sets this to the bundle it fetched from infrastructure, so a missing file means "
                + "that fetch did not run or wrote elsewhere.\n"
                + "Failing rather than falling back to the committed copy: silently packaging a "
                + "different certificate than the one infrastructure published would be worse than a "
                + "red build.")
      }
      source = caBundleFromInfra
      logger.lifecycle("Staging CA bundle from CA_BUNDLE_SOURCE: ${source}")
    } else if (caBundleFromLocalDir.isFile()) {
      source = caBundleFromLocalDir
      logger.lifecycle("Staging CA bundle from ${localCaBundlePath} (CA_BUNDLE_SOURCE not set)")
    } else {
      logger.warn("No internal CA bundle: CA_BUNDLE_SOURCE is unset and ${localCaBundlePath} is "
              + "absent, so the package will not trust the PCR ingress private CA and every relay "
              + "would fail at the TLS handshake.\n"
              + "  Fine for local development and the integration tests, which use plain HTTP.\n"
              + "  Before deploying, either place the bundle at ${localCaBundlePath} (git-ignored) "
              + "or set CA_BUNDLE_SOURCE.")
      return
    }

    // An unset GitHub secret expands to an empty string, so a CI step can cheerfully write a
    // zero-byte or truncated "bundle". Catch that here rather than at the first TLS handshake in a
    // deployed environment.
    final int certificates = (source.getText('UTF-8') =~ /-----BEGIN CERTIFICATE-----/).count
    if (certificates == 0) {
      throw new GradleException("${source} contains no PEM certificate block.\n"
              + "If this came from CI, the secret or Key Vault fetch produced an empty or malformed "
              + "file — an unset GitHub secret expands to an empty string.")
    }

    final File target = stagedAppDir.get().asFile
    target.mkdirs()
    java.nio.file.Files.copy(source.toPath(), new File(target, stagedCaBundleName).toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    logger.lifecycle("Staged ${certificates} certificate(s) as ${stagedCaBundleName}")
  }
}

// An incomplete staged app fails in the least helpful way available: the host boots, reports itself
// healthy, serves no functions, and every caller times out instead of erroring. Assert the package
// is complete while there is still a build log to read the reason in.
tasks.register('verifyStagedApp') {
  description = 'Fails fast if the staged Azure Functions app is missing host.json or the function.'
  outputs.upToDateWhen { false }
  doLast {
    final File dir = stagedAppDir.get().asFile
    final List<String> required = ['host.json', 'PrisonCourtRegisterHearingResulted/function.json']
    // If a bundle was available to stage, the package must contain it. Without this, a staging step
    // that silently did nothing would produce a zip that deploys and then fails every relay at the
    // TLS handshake.
    if (caBundleExpected) {
      required.add(stagedCaBundleName)
    }
    final List<String> missing = required.findAll { !new File(dir, it).isFile() }
    if (!missing.isEmpty()) {
      final List<String> present = dir.isDirectory() ? (dir.list()?.sort() ?: ['<empty>'])
              : ['<directory does not exist>']
      throw new GradleException("The staged Azure Functions app at ${dir} is incomplete.\n"
              + "  missing: ${missing}\n"
              + "  present: ${present}\n"
              + "The Functions host would start, find no functions and serve nothing, so anything\n"
              + "waiting on it times out rather than failing. Check that azureFunctionsPackage ran,\n"
              + "and that no other task declares the staging directory as an output (see\n"
              + "stageInternalCaBundle).")
    }
  }
}

tasks.named('azureFunctionsPackage') {
  finalizedBy tasks.named('pruneWorkerProvidedJars'), tasks.named('stageInternalCaBundle')
}

tasks.named('verifyStagedApp') {
  mustRunAfter tasks.named('azureFunctionsPackage'), tasks.named('stageInternalCaBundle')
}

// The zip must be built after the bundle is staged, or it ships without it — and must never be built
// from an incomplete staging directory.
tasks.matching { it.name == 'azureFunctionsPackageZip' }.configureEach {
  mustRunAfter tasks.named('stageInternalCaBundle')
  dependsOn tasks.named('stageInternalCaBundle'), tasks.named('verifyStagedApp')
}
