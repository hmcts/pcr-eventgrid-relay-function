name: Build and Deploy (Non-Release)

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  ci-draft:
    uses: ./.github/workflows/ci-build-deploy.yml
    permissions:
      # write, not read: the called workflow's Publish-Release job creates the tag and release. A
      # called workflow cannot request more permission than its caller grants — with `read` here the
      # whole run is rejected at startup, before any job executes.
      contents: write
    secrets:
      HMCTS_CP_ADO_PAT: ${{ secrets.HMCTS_CP_ADO_PAT }}
      PCR_INTERNAL_CA_BUNDLE: ${{ secrets.PCR_INTERNAL_CA_BUNDLE }}
    with:
      # Not "dev" — dev isn't a valid pipeline 793 environment (pcr-data's backend is steccm64
      # regardless of source topic, so a dev relay would just duplicate ste's).
      environment: ste
      # Build and verify the zip on PRs, but only deploy on a push to main.
      trigger_deploy: ${{ github.event_name == 'push' }}
