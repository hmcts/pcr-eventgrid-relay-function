name: CI Build and Deploy

# Reusable workflow, called by ci-draft.yml (PR / push to main) and ci-released.yml (release).
#
# Adapted from service-cp-crime-results-pcr's ci-build-publish.yml. The Build job mirrors it closely;
# versioning and everything downstream are deliberately different, because this repo ships an
# **Azure Functions deployment zip**, not a Spring Boot container (and see the Version job on why
# hmcts/artefact-version-action is not used):
#
#   PCR service                                    this repo
#   -----------                                    ---------
#   publish bootJar to Maven repos          ->     (nothing — not a library)
#   build Docker image, push to ghcr        ->     (nothing — no image)
#   ADO pipeline 460: copy image to ACR     ->     (nothing — the release asset IS the artefact)
#   ADO pipeline 434: Helm deploy to AKS    ->     trigger ADO pipeline 793 (pcr-eventgrid-relay-deploy)
#
# Implements docs/pipeline/hybrid-deploy/design.md. GHA never touches Azure — HMCTS_CP_ADO_PAT is
# the only Azure-adjacent credential, used solely to trigger/monitor the ADO deploy pipeline.
#
on:
  workflow_call:
    secrets:
      HMCTS_CP_ADO_PAT:
        required: false
        description: "PAT to trigger/monitor the ADO deploy pipeline. Deploy is skipped when unset."
      GITLEAKS_LICENSE:
        required: false
      PCR_INTERNAL_CA_BUNDLE:
        required: false
        description: >-
          PEM bundle for the PCR ingress private CA chain, held in infrastructure rather than in this
          repo. When set, the Build job writes it outside the repo tree and points CA_BUNDLE_SOURCE
          at it, so that is what ships in the zip. When unset, the build falls back to the copy
          committed in the repo root and warns. See docs/TODO-production-readiness.md 4.1.
    inputs:
      environment:
        required: true
        type: string
        default: ste
      trigger_deploy:
        required: true
        type: boolean
      # deploy_app_name/function_resource_group used to be passed here for the old direct
      # Azure/functions-action deploy. design.md §3 item 2 is explicit: "Deliberately not passing
      # the Function App name or resource group: ADO owns the environment->app mapping" — pipeline
      # 793 resolves both itself from environment/slot. Removed rather than left as dead inputs.

jobs:
  # Version is computed as "the NEXT patch after the highest existing tag", not as a suffix on the
  # latest one. That is the whole point of not using hmcts/artefact-version-action here, and it is worth
  # spelling out because the divergence from every sibling repo is deliberate:
  #
  #   the action gives   0.0.1-<sha>   for a build made AFTER v0.0.1 was released
  #   semver says        0.0.1-<sha> < 0.0.1
  #   so the newer artefact sorts BELOW the release it came after — wrong for a promotion pipeline,
  #   where "which of these two versions is newer" has to have an obvious answer.
  #
  # Computing the next patch instead gives 0.0.2 on main and 0.0.2-<sha> on a PR, both of which sort
  # above v0.0.1 and in the right order relative to each other.
  #
  # Control: bump the minor or major by hand-tagging (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
  # Automatic patches continue from whatever the highest tag is, so a hand-tag is respected immediately
  # and needs no change here.
  #
  # The job name must stay `Artefact-Version`: the `main` ruleset requires a status check called
  # `ci-draft / Artefact-Version`. Renaming the job silently makes that check unsatisfiable, and the
  # symptom is a PR stuck on BLOCKED with every check green — nothing points at the cause.
  Artefact-Version:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    outputs:
      artefact_version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: v
        run: |
          set -euo pipefail
          # --force because actions/checkout can leave a stale tag ref for a re-created tag.
          git fetch --tags --force --quiet

          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          LATEST=${LATEST:-v0.0.0}
          IFS=. read -r MAJOR MINOR PATCH <<<"${LATEST#v}"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"

          case "${{ github.event_name }}:${{ github.ref }}" in
            release:*)
              # Someone hand-tagged and published a release, typically to take a deliberate minor or
              # major. The released tag IS the version — do not compute one. The release already
              # exists, so Publish-Release uploads the asset to it rather than creating it.
              TAG="${{ github.ref_name }}"
              VERSION="${TAG#v}"
              PUBLISH=true
              ;;
            push:refs/heads/main)
              TAG="v$NEXT"
              VERSION="$NEXT"
              PUBLISH=true
              ;;
            *)
              # A PR. Build a pre-release of the version this would become, so the artefact is
              # traceable and sorts correctly, but never publish or deploy it.
              TAG="v$NEXT"
              VERSION="$NEXT-$(git rev-parse --short HEAD)"
              PUBLISH=false
              ;;
          esac

          echo "latest tag : $LATEST"
          echo "version    : $VERSION"
          echo "tag        : $TAG"
          echo "publish    : $PUBLISH"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

  Build:
    needs: [Artefact-Version]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current

      # A single `build` covers both suites. Unlike service-cp-crime-results-pcr there is no manual
      # composeUp/composeDown sequencing here: `check` depends on the `integrationTest` task, and
      # dockerCompose.isRequiredBy brings the stack up before it and tears it down afterwards —
      # including when tests fail. See gradle/docker-test.gradle.
      # Pulled explicitly so the ~500MB download is its own step rather than eating into the
      # integration test's readiness budget. A cold runner previously spent that budget downloading
      # and the host-ready wait timed out, failing CI while passing locally every time.
      - name: Pre-pull the Azure Functions image
        run: docker pull mcr.microsoft.com/azure-functions/java:4-java25

      # No certificate material is tracked in this repository, so the bundle can only come from
      # infrastructure. Without this secret the packaged app has no CA bundle at all.
      #
      # Written to RUNNER_TEMP, deliberately outside the workspace: a PEM materialised inside the repo
      # tree can be committed by accident and trips the secret scanners. CA_BUNDLE_SOURCE is exported
      # via GITHUB_ENV so both the `build` and the packaging step below pick it up; build.gradle fails
      # the build if it points at nothing or at a file with no certificate in it.
      - name: Materialise the internal CA bundle from infrastructure
        env:
          CA_BUNDLE: ${{ secrets.PCR_INTERNAL_CA_BUNDLE }}
        run: |
          if [ -z "$CA_BUNDLE" ]; then
            echo "::warning::PCR_INTERNAL_CA_BUNDLE is not set - this build will package no CA bundle."
            echo "::warning::The artefact is still valid, but a deployed app would fail every relay at the TLS handshake."
            echo "::warning::See docs/TODO-production-readiness.md 4.1."
            exit 0
          fi

          DEST="$RUNNER_TEMP/internal_ca_certs.pem"
          printf '%s\n' "$CA_BUNDLE" > "$DEST"

          # Tolerate a base64-encoded secret, which is how a PEM is often stored to survive
          # copy-paste and single-line secret fields.
          if ! grep -q 'BEGIN CERTIFICATE' "$DEST"; then
            if base64 -d < "$DEST" > "$DEST.decoded" 2>/dev/null && grep -q 'BEGIN CERTIFICATE' "$DEST.decoded"; then
              mv "$DEST.decoded" "$DEST"
              echo "Secret was base64-encoded; decoded it."
            else
              rm -f "$DEST.decoded"
              echo "::error::PCR_INTERNAL_CA_BUNDLE is set but is neither a PEM nor base64-encoded PEM."
              exit 1
            fi
          fi

          chmod 600 "$DEST"
          echo "CA_BUNDLE_SOURCE=$DEST" >> "$GITHUB_ENV"
          echo "Staged $(grep -c 'BEGIN CERTIFICATE' "$DEST") certificate(s) for packaging."

      - name: Gradle build
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
        run: |
          echo "Building with ARTEFACT_VERSION=$ARTEFACT_VERSION"
          ./gradlew build -DARTEFACT_VERSION="$ARTEFACT_VERSION"

      # A green `build` is not proof the integration tests ran — if they were skipped or never
      # selected, `build` still passes. Assert the suite executed with a non-zero test count, because
      # a silently-empty integration suite reads exactly like a passing one.
      - name: Assert the integration tests actually ran
        run: |
          RESULTS=build/test-results/integrationTest
          if [ ! -d "$RESULTS" ]; then
            echo "::error::$RESULTS is missing - the integration tests did not run"; exit 1
          fi
          TOTAL=$(grep -ho 'tests="[0-9]*"' "$RESULTS"/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "integration tests executed: $TOTAL"
          if [ "$TOTAL" -lt 1 ]; then
            echo "::error::integration suite reported $TOTAL tests"; exit 1
          fi

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Package Azure Functions zip
        id: package
        env:
          ARTEFACT_VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
        run: |
          ./gradlew azureFunctionsPackageZip \
            -DARTEFACT_VERSION="$ARTEFACT_VERSION" \
            2>&1 | tail -5
          # Discover what Gradle actually produced rather than reconstructing the filename here.
          # Duplicating the name across build.gradle and this workflow is exactly the drift that broke
          # the compose mount.
          ZIP=$(ls build/azure-functions/*.zip)
          test -f "$ZIP" || { echo "::error::no zip produced"; exit 1; }
          echo "zip_name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"
          echo "packaged $(basename "$ZIP")"

      # Guards the two things most likely to break silently: the generated binding, and the
      # worker-provided jar that must NOT be shipped (see pruneWorkerProvidedJars in build.gradle).
      - name: Verify packaged zip
        run: |
          ZIP="build/azure-functions/${{ steps.package.outputs.zip_name }}"
          test -f "$ZIP" || { echo "::error::$ZIP was not produced"; exit 1; }

          echo "--- zip contents ---"
          unzip -l "$ZIP"

          unzip -p "$ZIP" PrisonCourtRegisterHearingResulted/function.json > /tmp/function.json
          grep -q '"type" : "eventGridTrigger"' /tmp/function.json \
            || { echo "::error::function.json is missing the eventGridTrigger binding"; exit 1; }

          # scriptFile embeds the versioned jar name, so an injected ARTEFACT_VERSION that does not
          # reach the jar would produce a zip the host cannot load, with an obscure runtime error.
          SCRIPT_FILE=$(python3 -c "import json;print(json.load(open('/tmp/function.json'))['scriptFile'].replace('../',''))")
          echo "function.json scriptFile -> $SCRIPT_FILE"
          unzip -l "$ZIP" | grep -q "$SCRIPT_FILE" \
            || { echo "::error::scriptFile '$SCRIPT_FILE' is not in the zip — version mismatch"; exit 1; }

          if unzip -l "$ZIP" | grep -q 'azure-functions-java-library'; then
            echo "::error::azure-functions-java-library was shipped in lib/ — the worker provides it."
            echo "::error::pruneWorkerProvidedJars did not run. See build.gradle."
            exit 1
          fi

          # Mirrors verifyStagedApp, at the zip rather than the staging directory: if a bundle was
          # available at build time it must actually be in the artefact. A zip without it deploys
          # fine and then fails every relay at the TLS handshake.
          if [ -n "${CA_BUNDLE_SOURCE:-}" ]; then
            unzip -l "$ZIP" | grep -q 'internal_ca_certs.pem' \
              || { echo "::error::CA_BUNDLE_SOURCE was set but the bundle is not in the zip"; exit 1; }
            echo "CA bundle present in the zip, from infrastructure."
          else
            # No certificate material is tracked in this repo, so with the secret unset there is
            # nothing for CI to package. The zip is fine for review and for the Deploy job to
            # publish, but the running app cannot complete TLS to the PCR ingress until the bundle
            # is supplied.
            echo "::warning::No CA bundle in this artefact - PCR_INTERNAL_CA_BUNDLE is not set."
            echo "::warning::Deploying this zip gives an app that fails every relay at the TLS handshake."
            echo "::warning::See docs/TODO-production-readiness.md 4.1."
          fi

          echo "Zip verified: eventGridTrigger binding present, no worker-provided jars."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/test-results/test/
            build/test-results/integrationTest/
            build/reports/tests/test/
            build/reports/tests/integrationTest/
            build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn

      - name: Upload Functions zip
        uses: actions/upload-artifact@v7
        with:
          name: function-app-zip
          path: build/azure-functions/${{ steps.package.outputs.zip_name }}
          if-no-files-found: error

  # Tags and releases only AFTER Build has passed, and creates the tag as part of creating the release
  # rather than as a separate earlier step. That ordering is deliberate: tagging first would leave an
  # orphan tag behind every failed build, and the next run would then compute its next-patch from a tag
  # that never shipped anything.
  #
  # `gh release create` creates the tag itself, at --target, so there is no separate `git push --tags`.
  #
  # This does NOT re-trigger ci-released.yml. Events raised by GITHUB_TOKEN do not start new workflow
  # runs, so the `release: published` trigger stays for human-made releases only. Do not "fix" that by
  # switching to a PAT without thinking about the loop it would create.
  Publish-Release:
    needs: [Artefact-Version, Build]
    if: ${{ needs.Artefact-Version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the tag and the release
    steps:
      - name: Download the built zip
        uses: actions/download-artifact@v8
        with:
          name: function-app-zip
          path: dist

      - name: Create tag and release with the zip attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GH_REPO, because this job deliberately does NOT check the repo out — it only needs the
          # built zip. Without it, `gh` tries to infer the repository from the git remote and dies with
          # "failed to run git: fatal: not a git repository", which reads like a gh bug rather than a
          # missing checkout. Setting GH_REPO is cheaper than adding a checkout we have no other use for.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.Artefact-Version.outputs.tag }}
          VERSION: ${{ needs.Artefact-Version.outputs.artefact_version }}
          ZIP: dist/${{ needs.Build.outputs.zip_name }}
        run: |
          set -euo pipefail
          test -f "$ZIP" || { echo "::error::$ZIP missing — nothing to publish"; exit 1; }

          NOTES=$(printf 'Azure Functions deployment package `%s`.\n\nCommit: `%s`\nPromote by deploying this asset to the target environment — do not rebuild.' "$VERSION" "$GITHUB_SHA")

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Normal path: a merge to main. Creates the tag at --target as part of the release, so a
            # failed Build never leaves an orphan tag behind.
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
            echo "Created $TAG with $(basename "$ZIP")" >> "$GITHUB_STEP_SUMMARY"
          elif gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q .; then
            # A re-run of an already-published version. Never replace a published artefact with a
            # different build — that would break the promise that a version is immutable, which is the
            # whole basis of promoting one artefact through environments.
            echo "::warning::$TAG already has an asset — leaving the published artefact untouched."
          else
            # A human created the release by hand (a milestone tag); attach this build to it.
            gh release upload "$TAG" "$ZIP"
            echo "Attached $(basename "$ZIP") to existing $TAG" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ==========================================================================================
  # Implements docs/pipeline/hybrid-deploy/design.md §3 item 2. Replaces the old direct
  # Azure/functions-action deploy — GHA no longer touches Azure at all, matching
  # service-cp-crime-results-pcr's own pattern of triggering ADO pipelines 460/434 rather than
  # authenticating to Azure itself. HMCTS_CP_ADO_PAT is the only credential needed; confirmed
  # already shared with this repo via a live workflow test (distinct from HMCTS_ADO_PAT, which
  # PCR uses for 460/434 and which is NOT shared here — easy to conflate the two names).
  #
  # pipeline_id 793 (pcr-eventgrid-relay-deploy, hmcts-cpp/cpp-apps) is a repo-specific pipeline,
  # not yet the shared cpp-azure-devops-templates one the design envisions (§5 — still a
  # platform-team dependency). It downloads the GitHub Release asset Publish-Release attaches
  # above, then runs AzureFunctionApp@2 zipDeploy against the target environment's app —
  # deliberately still passing environment/slot, since this pipeline resolves the app/resource
  # group itself rather than a platform-owned mapping table.
  # ==========================================================================================
  Trigger-Deploy:
    needs: [Artefact-Version, Build]
    if: ${{ inputs.trigger_deploy }}
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy credentials are configured
        id: creds
        env:
          HMCTS_CP_ADO_PAT: ${{ secrets.HMCTS_CP_ADO_PAT }}
        run: |
          if [ -z "$HMCTS_CP_ADO_PAT" ]; then
            echo "::warning::HMCTS_CP_ADO_PAT is not set — skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger ADO deploy pipeline
        id: trigger
        if: steps.creds.outputs.configured == 'true'
        uses: hmcts/trigger-ado-pipeline@v2
        with:
          pipeline_id: 793
          ado_pat: ${{ secrets.HMCTS_CP_ADO_PAT }}
          template_parameters: >
            {
              "environment": "${{ inputs.environment }}",
              "artefactVersion": "${{ needs.Artefact-Version.outputs.artefact_version }}",
              "targetRepository": "${{ github.repository }}"
            }

      - name: Wait for it
        if: steps.creds.outputs.configured == 'true'
        uses: hmcts/monitor-ado-pipeline@v1
        with:
          pipeline_id: 793
          run_id: ${{ steps.trigger.outputs.run_id }}
          ado_pat: ${{ secrets.HMCTS_CP_ADO_PAT }}
          poll_interval: 30
          timeout: 1800

      - name: Summarise
        if: always()
        run: |
          if [ "${{ steps.creds.outputs.configured }}" = "true" ]; then
            echo "Triggered ADO pipeline 793 for ${{ needs.Artefact-Version.outputs.artefact_version }} -> ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deploy skipped — HMCTS_CP_ADO_PAT not configured. See ci-build-deploy.yml." >> "$GITHUB_STEP_SUMMARY"
          fi
