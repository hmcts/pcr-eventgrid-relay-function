name: CI Build and Deploy – Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  ci-release:
    uses: ./.github/workflows/ci-build-deploy.yml
    permissions:
      id-token: write
      contents: read
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PCR_INTERNAL_CA_BUNDLE: ${{ secrets.PCR_INTERNAL_CA_BUNDLE }}
    with:
      environment: dev
      trigger_deploy: true
