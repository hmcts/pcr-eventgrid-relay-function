name: CI Build and Deploy – Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  ci-release:
    uses: ./.github/workflows/ci-build-deploy.yml
    permissions:
      id-token: write
      # write, not read: the called workflow's Publish-Release job creates the tag and release. A
      # called workflow cannot request more permission than its caller grants — with `read` here the
      # whole run is rejected at startup, before any job executes.
      contents: write
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PCR_INTERNAL_CA_BUNDLE: ${{ secrets.PCR_INTERNAL_CA_BUNDLE }}
    with:
      environment: dev
      trigger_deploy: true
