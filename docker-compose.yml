services:
  # The app under test, running in the real Azure Functions Java 25 runtime. The app root is the
  # staging directory produced by `./gradlew azureFunctionsPackage`, so this runs exactly what would
  # be deployed. composeUp depends on that task — see gradle/docker-test.gradle.
  functions:
    image: mcr.microsoft.com/azure-functions/java:4-java25
    # Required, not cosmetic. The image is published for linux/amd64 only. On Apple Silicon,
    # `docker compose` refuses to pull it — "no matching manifest for linux/arm64/v8" — where
    # `docker run` would silently fall back to emulation. Without this line a developer on arm64
    # with a cold image cache cannot run the integration tests at all; it only appears to work if
    # the image happens to be cached already. No effect on amd64 CI runners.
    platform: linux/amd64
    environment:
      AzureWebJobsScriptRoot: /home/site/wwwroot
      FUNCTIONS_WORKER_RUNTIME: java
      # File-based secret storage, seeded with known keys, so tests can call
      # /runtime/webhooks/eventgrid with a predictable ?code=. Without the eventgrid_extension
      # system key the host answers 401, and AZURE_FUNCTIONS_ENVIRONMENT=Development does not
      # waive it.
      AzureWebJobsSecretStorageType: files
      AzureFunctionsJobHost__Logging__Console__IsEnabled: "true"
      # Points at the WireMock service below, over the compose network.
      PCR_SERVICE_INGESTION_ENDPOINT: http://wiremock:8080/internal/hearing-results
      # Keep the failure-path tests quick.
      FORWARD_MAX_ATTEMPTS: "2"
      FORWARD_RETRY_DELAY_IN_SECONDS: "0"
    volumes:
      - ${FUNCTION_APP_STAGING_DIR:-./build/azure-functions/fa-ste-ccp0121-pcrrelay}:/home/site/wwwroot:ro
      - ./build/functions-host-secrets:/azure-functions-host/Secrets
    ports:
      - "7071:80"
    depends_on:
      - wiremock

  # Stands in for service-cp-crime-results-pcr. Driven over its admin API from the tests, so stubs
  # and request assertions work the same as an in-JVM WireMock.
  wiremock:
    image: wiremock/wiremock:3.13.2
    command: [ "--local-response-templating", "--verbose" ]
    ports:
      - "8089:8080"
