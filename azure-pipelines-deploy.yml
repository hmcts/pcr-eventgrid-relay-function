name: CPP PCR EventGrid Relay Function Deployment
trigger: none
pr: none

# ==============================================================================
# Deploy-only pipeline, implementing docs/pipeline/hybrid-deploy/design.md. Build stays in
# GitHub Actions (ci-build-deploy.yml) — the shared CPP ADO agent pools only offer Java 21,
# and this app's Gradle toolchain pins Java 25 (see CLAUDE.md "CI — GitHub Actions"). This
# pipeline downloads the GitHub Release asset that build produces and deploys it; it never
# runs Gradle itself.
#
# Registered in hmcts-cpp/cpp-apps as pipeline 793 (pcr-eventgrid-relay-deploy) — a
# repo-specific pipeline, not yet the shared cpp-azure-devops-templates one design.md §5
# envisions (still a platform-team dependency).
#
# Provision stage: every az command is taken verbatim from docs/DEPLOYMENT.md, a runbook
# actually run against STE-CCP0121 (verified 7 Aug 2026). Deploy stage: implements design.md
# §2.1 (GitHub Release artefact) and §3.1 (the WEBSITE_RUN_FROM_PACKAGE=1 cut-over via
# AzureFunctionApp@2/zipDeploy). Anything not lifted from one of those two documents is called
# out inline as a new choice this pipeline makes, so it's obvious what's proven versus what
# needs review — in particular, the GitHub PAT this now needs is NOT yet provisioned (see the
# Deploy stage).
# ==============================================================================

parameters:
- name: environment
  displayName: Environment
  type: string
  default: ste
  values:
  - sit
  - ste
  - prp
  - prd
- name: slot
  displayName: "ccpNNNN slot within the environment, e.g. ccp0121 (DEPLOYMENT.md §2.2 — not every slot has a topic; confirm before using one not already deployed)"
  type: string
  default: ccp0121
- name: platform
  displayName: Platform
  type: string
  default: nonlive
  values:
  - nonlive
  - live
- name: artefactVersion
  displayName: "Version of the pcr-eventgrid-relay-function package to deploy (a git tag, without the leading v — matches the GitHub Release this reads from)"
  type: string
  default: ''
- name: targetRepository
  displayName: "owner/repo to download the release asset from — name matches design.md's own trigger snippet exactly, since GH Actions' template_parameters are keyed by parameter name"
  type: string
  default: 'hmcts/pcr-eventgrid-relay-function'
- name: agentPool
  values:
  - "ubuntu-ado-agents-mdv"
  - "ubuntu-ado-agents-mpd"
  default: "ubuntu-ado-agents-mdv"
- name: runProvision
  displayName: "Run one-time provisioning (create app, VNet integration, Event Grid subscription). DEPLOYMENT.md §6 calls the subscription step 'the point of no return' — live events start flowing immediately. Leave false for every routine deploy."
  type: boolean
  default: false

variables:
# azureServiceConnection is genuinely platform-scoped (nonlive vs live) — one value covers
# every environment on that platform.
- template: azure-pipeline-variables/${{ parameters.platform }}.yml
# pcrServiceIngestionEndpoint/deadletterStorageResourceId are NOT platform-scoped — dev, sit,
# and ste each have a different real ingress host (confirmed the hard way earlier: ns-dev-amp-01
# turned out to secretly back steccm64, so nothing about these values can be assumed to match
# across environments). A single flat value per platform silently breaks every environment
# except whichever one it was last set for. parameters.environment resolves at template-expansion
# time same as parameters.platform does, so this can split the same way.
- template: azure-pipeline-variables/env-${{ parameters.environment }}.yml

resources:
  repositories:
  - repository: cppAzureDevOpsTemplates
    type: github
    name: hmcts/cpp-azure-devops-templates
    ref: 'main'
    endpoint: 'hmcts'

stages:
  # ============================================================================
  # Provision — one-time, manual-gated. DEPLOYMENT.md §4 (create app + VNet
  # integration + static settings) and §6 (Event Grid subscription).
  # Idempotency checks are this pipeline's own addition — the doc's commands
  # assume a fresh resource group and would error or duplicate on a re-run
  # otherwise.
  # ============================================================================
  - stage: Provision
    condition: and(eq(variables['Build.Reason'], 'Manual'), eq('${{ parameters.runProvision }}', 'true'))
    pool:
      name: ${{ parameters.agentPool }}
    jobs:
    - job: provision
      timeoutInMinutes: 30
      steps:
      - task: AzureCLI@2
        name: coords
        displayName: 'Resolve coordinates and pre-flight checks (DEPLOYMENT.md §1.1, §2.2, §4)'
        inputs:
          azureSubscription: ${{ variables.azureServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            ENV="${{ parameters.environment }}"
            SLOT="${{ parameters.slot }}"
            RG="RG-$(echo $ENV | tr a-z A-Z)-$(echo $SLOT | tr a-z A-Z)-HEARINGRES"
            APP="fa-${ENV}-${SLOT}-pcrrelay"
            PLAN="as-${ENV}-${SLOT}-hearingres"
            STORAGE="sa${ENV}${SLOT}hearingres"   # DEPLOYMENT.md §4: "verify — naming is not perfectly regular"
            AI="ai-${ENV}-${SLOT}-hearingres"
            TOPIC_NAME="eg-${ENV}-${SLOT}-hearingres"

            echo "##vso[task.setvariable variable=RG;isOutput=true]$RG"
            echo "##vso[task.setvariable variable=APP;isOutput=true]$APP"
            echo "##vso[task.setvariable variable=PLAN;isOutput=true]$PLAN"
            echo "##vso[task.setvariable variable=STORAGE;isOutput=true]$STORAGE"
            echo "##vso[task.setvariable variable=AI;isOutput=true]$AI"
            echo "##vso[task.setvariable variable=TOPIC_NAME;isOutput=true]$TOPIC_NAME"

            # DEPLOYMENT.md §2.2: "The plan's OS ... Confirm ... must be true. You
            # cannot mix OS on one plan."
            RESERVED=$(az appservice plan show -g "$RG" -n "$PLAN" --query reserved -o tsv 2>/dev/null || echo "MISSING")
            if [ "$RESERVED" != "true" ]; then
              echo "##vso[task.logissue type=error]App Service plan $PLAN missing or not Linux (reserved=$RESERVED). Java 25 needs Linux; do not let this create a new plan."
              exit 1
            fi

            # DEPLOYMENT.md §2.2: "The topic must exist ... not all [slots do]."
            if ! az eventgrid topic show -n "$TOPIC_NAME" -g "$RG" &>/dev/null; then
              echo "##vso[task.logissue type=error]Topic $TOPIC_NAME does not exist in $RG — nothing to subscribe to."
              exit 1
            fi

      - task: AzureCLI@2
        displayName: 'Create the Function App if it does not already exist (DEPLOYMENT.md §4.1)'
        inputs:
          azureSubscription: ${{ variables.azureServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            RG="$(coords.RG)"; APP="$(coords.APP)"; PLAN="$(coords.PLAN)"
            STORAGE="$(coords.STORAGE)"; AI="$(coords.AI)"
            ENV="${{ parameters.environment }}"

            if az functionapp show -g "$RG" -n "$APP" &>/dev/null; then
              echo "Function App $APP already exists — skipping creation."
            else
              # --runtime-version 25.0 (not 25), --tags with all four required
              # keys, --os-type Linux: each documented in DEPLOYMENT.md §4.1 as a
              # flag that fails the *whole* call with a misleading error if wrong.
              az functionapp create -g "$RG" -n "$APP" \
                --plan "$PLAN" \
                --storage-account "$STORAGE" \
                --runtime java --runtime-version 25.0 --functions-version 4 --os-type Linux \
                --app-insights "$AI" \
                --tags environment="$ENV" application=CP businessArea=crime builtFrom=Functionapp
            fi

      - task: AzureCLI@2
        displayName: 'VNet integration (DEPLOYMENT.md §4.2 — required, easy to miss)'
        inputs:
          azureSubscription: ${{ variables.azureServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            RG="$(coords.RG)"; APP="$(coords.APP)"
            ENV="${{ parameters.environment }}"; SLOT="${{ parameters.slot }}"

            EXISTING=$(az functionapp show -g "$RG" -n "$APP" --query properties.virtualNetworkSubnetId -o tsv)
            if [ -n "$EXISTING" ] && [ "$EXISTING" != "None" ]; then
              echo "VNet integration already present — skipping."
            else
              # Deliberately copies the sibling prisoncourtreg app's subnet — all
              # apps on one plan must share a subnet, and the plan is already
              # joined, so this consumes no extra addresses (DEPLOYMENT.md §4.2).
              SUBNET_ID=$(az resource show -g "$RG" -n "fa-${ENV}-${SLOT}-prisoncourtreg" \
                --resource-type Microsoft.Web/sites --query properties.virtualNetworkSubnetId -o tsv)
              az functionapp vnet-integration add -g "$RG" -n "$APP" \
                --vnet "$(dirname "$(dirname "$SUBNET_ID")")" \
                --subnet "$(basename "$SUBNET_ID")"
            fi

      - task: AzureCLI@2
        displayName: 'Static application settings (DEPLOYMENT.md §4.3)'
        inputs:
          azureSubscription: ${{ variables.azureServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            RG="$(coords.RG)"; APP="$(coords.APP)"
            # $(pcrServiceIngestionEndpoint) must come from the per-platform
            # variables template — the doc deliberately does not record ingress
            # hostnames in this repo ("get the per-environment value from the
            # platform team"). NEW for this pipeline: add that variable to
            # azure-pipeline-variables/${{ parameters.platform }}.yml before use.
            az functionapp config appsettings set -g "$RG" -n "$APP" --settings \
              PCR_SERVICE_INGESTION_ENDPOINT="$(pcrServiceIngestionEndpoint)" \
              PCR_SERVICE_CA_BUNDLE_PATH=/home/site/wwwroot/internal_ca_certs.pem \
              FORWARD_MAX_ATTEMPTS=3 \
              FORWARD_RETRY_DELAY_IN_SECONDS=2

      - task: AzureCLI@2
        displayName: 'Verify function registered before wiring the subscription (DEPLOYMENT.md §5.1)'
        inputs:
          azureSubscription: ${{ variables.azureServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            RG="$(coords.RG)"; APP="$(coords.APP)"
            # "Java cold-starts on Elastic Premium take up to a minute; retry
            # before concluding failure. This must pass before wiring the
            # subscription — Event Grid validates the target function exists."
            for i in $(seq 1 10); do
              if az functionapp function list -g "$RG" -n "$APP" -o tsv --query "[?name=='PrisonCourtRegisterHearingResulted']" | grep -q .; then
                echo "Function registered."
                exit 0
              fi
              echo "Not registered yet (cold start) — retrying in 15s..."
              sleep 15
            done
            echo "##vso[task.logissue type=error]Function never registered — the app has no deployed code yet. Run the Deploy stage first."
            exit 1

      - task: AzureCLI@2
        displayName: 'Wire the Event Grid subscription — LIVE EVENTS START FLOWING (DEPLOYMENT.md §6)'
        inputs:
          azureSubscription: ${{ variables.azureServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            RG="$(coords.RG)"; APP="$(coords.APP)"; TOPIC_NAME="$(coords.TOPIC_NAME)"
            TOPIC=$(az eventgrid topic show -n "$TOPIC_NAME" -g "$RG" --query id -o tsv)

            if az eventgrid event-subscription show --name egs-pcr-relay --source-resource-id "$TOPIC" &>/dev/null; then
              echo "Subscription egs-pcr-relay already exists — skipping."
              exit 0
            fi

            FN="$(az functionapp show -g "$RG" -n "$APP" --query id -o tsv)/functions/PrisonCourtRegisterHearingResulted"

            # --included-event-types Hearing_Resulted is required for
            # correctness, not tidiness: the topic also carries
            # Hearing_Resulted_Complex, which PCR rejects with a non-retryable
            # 400 (DEPLOYMENT.md §6).
            #
            # $(deadletterStorageResourceId) is a NEW variable this pipeline
            # needs added to the platform template — the doc notes the seven
            # siblings have no dead-letter destination and a failing event is
            # silently discarded after 24h without one (DEPLOYMENT.md §6).
            az eventgrid event-subscription create \
              --name egs-pcr-relay \
              --source-resource-id "$TOPIC" \
              --endpoint-type azurefunction --endpoint "$FN" \
              --included-event-types Hearing_Resulted \
              --max-delivery-attempts 30 --event-ttl 1440 \
              --deadletter-endpoint "$(deadletterStorageResourceId)/blobServices/default/containers/pcr-relay-deadletter"

  # ============================================================================
  # Deploy — routine, runs on every release. Never touches the Event Grid
  # subscription or creates the app; both are Provision-only, one-time actions.
  #
  # Implements docs/pipeline/hybrid-deploy/design.md §2.1/§3.1, replacing this pipeline's
  # earlier bespoke mechanism (Azure Artifacts Universal Package + hand-rolled blob-SAS
  # WEBSITE_RUN_FROM_PACKAGE script — see git history if that's ever needed for reference).
  #
  # design.md §3.1 is explicit that the switch to zipDeploy is a ONE-TIME CUT-OVER, not
  # something to run casually against a live app: "proven against a throwaway app first, not
  # this one" — setting WEBSITE_RUN_FROM_PACKAGE=1 on its own, before SitePackages has
  # anything in it, leaves the app with NO CODE. AzureFunctionApp@2's zipDeploy sets that app
  # setting and populates SitePackages in the same operation, which is why deploy and cut-over
  # happen as a single task below rather than as separate steps — review the design doc's
  # sequencing (delete the Event Grid subscription first, outside any period events matter)
  # before running this against fa-ste-ccp0121-pcrrelay for real.
  # ============================================================================
  - stage: Deploy
    dependsOn: []
    condition: always()
    pool:
      name: ${{ parameters.agentPool }}
    jobs:
    - job: deploy
      timeoutInMinutes: 20
      steps:
      - task: AzureCLI@2
        name: coords
        displayName: 'Resolve coordinates'
        inputs:
          azureSubscription: ${{ variables.azureServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            ENV="${{ parameters.environment }}"; SLOT="${{ parameters.slot }}"
            echo "##vso[task.setvariable variable=RG;isOutput=true]RG-$(echo $ENV | tr a-z A-Z)-$(echo $SLOT | tr a-z A-Z)-HEARINGRES"
            echo "##vso[task.setvariable variable=APP;isOutput=true]fa-${ENV}-${SLOT}-pcrrelay"

      # design.md §2.1: the artefact is a GitHub Release asset (immutable, versioned) —
      # Actions artifacts expire (90 days), and a zip has no business being forced into a
      # Maven-shaped Azure Artifacts coordinate the way the PCR service's jar is.
      #
      # NEW credential requirement, not yet provisioned: $(githubToken) below must be a real
      # secret (a Variable Group or pipeline Library secret, not a plain YAML parameter — those
      # aren't masked) holding a GitHub PAT with `contents: read` on this repo. Nothing today
      # supplies it; this step will fail with 401 until that's set up.
      - bash: |
          set -euo pipefail
          mkdir -p "$(Pipeline.Workspace)/package"
          TAG="v${{ parameters.artefactVersion }}"
          echo "Downloading release asset for $TAG from ${{ parameters.targetRepository }}"

          ASSET_URL=$(curl -sf -H "Authorization: Bearer $(githubToken)" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ parameters.targetRepository }}/releases/tags/$TAG" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print([a['url'] for a in d['assets'] if a['name'].endswith('.zip')][0])")

          curl -sfL -H "Authorization: Bearer $(githubToken)" \
            -H "Accept: application/octet-stream" \
            -o "$(Pipeline.Workspace)/package/pcr-eventgrid-relay-function.zip" \
            "$ASSET_URL"

          test -s "$(Pipeline.Workspace)/package/pcr-eventgrid-relay-function.zip" \
            || { echo "##vso[task.logissue type=error]Downloaded asset is empty or missing"; exit 1; }
        displayName: 'Download the GitHub Release asset (design.md §2.1)'

      # design.md §3.1 cut-over. See the stage-level comment above before running this against
      # the real STE app rather than a throwaway one.
      - task: AzureFunctionApp@2
        displayName: 'Deploy to Azure Functions (zipDeploy — design.md §3.1 cut-over)'
        inputs:
          azureSubscription: ${{ variables.azureServiceConnection }}
          appType: functionAppLinux
          appName: $(coords.APP)
          resourceGroupName: $(coords.RG)
          package: '$(Pipeline.Workspace)/package/pcr-eventgrid-relay-function.zip'
          deploymentMethod: zipDeploy

      # Lifted from the legacy-app deploy pipeline's PROJECT_VERSION pattern: makes "what
      # version is actually live" a one-line `az functionapp config appsettings list` away.
      - task: AzureCLI@2
        displayName: 'Record deployed version'
        inputs:
          azureSubscription: ${{ variables.azureServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            az functionapp config appsettings set -g "$(coords.RG)" -n "$(coords.APP)" \
              --settings DEPLOYED_ARTEFACT_VERSION="${{ parameters.artefactVersion }}"

      - task: AzureCLI@2
        displayName: 'Verify function registered (DEPLOYMENT.md §5.1)'
        inputs:
          azureSubscription: ${{ variables.azureServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            RG="$(coords.RG)"; APP="$(coords.APP)"
            for i in $(seq 1 10); do
              if az functionapp function list -g "$RG" -n "$APP" -o tsv --query "[?name=='PrisonCourtRegisterHearingResulted']" | grep -q .; then
                echo "Function registered — deploy verified."
                exit 0
              fi
              echo "Not registered yet (cold start) — retrying in 15s..."
              sleep 15
            done
            echo "##vso[task.logissue type=error]Function never registered after deploy."
            exit 1
